<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email</title>
  </head>
  <!-- Email clients ignore <style> and external CSS, so every style is inline. -->
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f2f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
      color: #1c171b;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f2f4; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 448px"
          >
            <!-- Logo: same as the app header -->
            <tr>
              <td style="padding-bottom: 16px">
                <a
                  href="{{ .SiteURL }}"
                  style="font-size: 18px; color: #1c171b; text-decoration: none"
                >
                  💰 Couples Wallet
                </a>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  border: 1px solid #e4dfe4;
                  border-radius: 16px;
                  padding: 32px;
                "
              >
                <h1
                  style="
                    margin: 0 0 12px;
                    font-size: 24px;
                    font-weight: 700;
                    line-height: 1.3;
                  "
                >
                  Confirm your email
                </h1>
                <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.5">
                  Welcome to Couples Wallet! Click the button below to confirm
                  your email and finish creating your account.
                </p>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
                  Your shared wallet starts here. 💕
                </p>

                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background-color: #be185d;
                    color: #ffffff;
                    font-size: 14px;
                    font-weight: 500;
                    text-decoration: none;
                    padding: 10px 24px;
                    border-radius: 9999px;
                  "
                >
                  Confirm email
                </a>

                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 14px;
                    line-height: 1.5;
                    color: #6b5f69;
                  "
                >
                  If you didn't create an account, you can safely ignore this
                  email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
